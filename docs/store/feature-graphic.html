<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: "Noto Sans", "DejaVu Sans", sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 18% 20%, rgba(0, 194, 168, 0.35), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(40, 90, 220, 0.45), transparent 50%),
      linear-gradient(120deg, #0b5f63 0%, #0f4a7a 55%, #142f78 100%);
    position: relative;
  }
  /* faint map grid */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .left { position: absolute; left: 56px; top: 0; bottom: 0; width: 470px;
          display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 26px; }
  .brand img { width: 104px; height: 104px; border-radius: 24px;
               box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  .brand h1 { font-size: 52px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }
  .tagline { font-size: 32px; font-weight: 700; line-height: 1.2; margin-bottom: 22px; }
  .tagline span { color: #5ff0d8; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { font-size: 16px; font-weight: 600; padding: 7px 14px; border-radius: 999px;
          background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25); }

  /* sample stamped photo */
  .photo { position: absolute; right: 52px; top: 42px; width: 400px; height: 416px;
           border-radius: 22px; overflow: hidden;
           box-shadow: 0 24px 60px rgba(0,0,0,0.45); border: 3px solid rgba(255,255,255,0.85);
           transform: rotate(2.5deg);
           background: linear-gradient(180deg, #8fd3f4 0%, #c9ecf7 45%, #f3e2b8 62%, #7fb069 63%, #4f8a45 100%); }
  .sun { position: absolute; right: 60px; top: 46px; width: 64px; height: 64px; border-radius: 50%;
         background: #fff6c8; box-shadow: 0 0 40px #fff2a8; }
  .hill1 { position: absolute; left: -60px; bottom: 120px; width: 320px; height: 160px; border-radius: 50%;
           background: #5c9a52; }
  .hill2 { position: absolute; right: -80px; bottom: 110px; width: 360px; height: 180px; border-radius: 50%;
           background: #467f3f; }
  .building { position: absolute; left: 150px; bottom: 150px; width: 70px; height: 120px; background: #e8e2d4;
              border-radius: 4px 4px 0 0; box-shadow: 90px 30px 0 -10px #d7cfbd; }
  .building::after { content: ""; position: absolute; left: 12px; top: 14px; width: 46px; height: 80px;
              background: repeating-linear-gradient(180deg, #9db6c9 0 12px, transparent 12px 22px); }
  .stamp { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px;
           background: rgba(8, 10, 14, 0.80); display: flex; gap: 12px; align-items: center; }
  .map { width: 84px; height: 84px; border-radius: 12px; flex: none; position: relative; overflow: hidden;
         border: 2px solid #00c2a8;
         background:
           linear-gradient(35deg, transparent 46%, #f6d36b 46% 52%, transparent 52%),
           linear-gradient(-20deg, transparent 60%, #ffffff 60% 64%, transparent 64%),
           linear-gradient(90deg, transparent 30%, #ffffff 30% 34%, transparent 34%),
           #dfe9d8; }
  .map::after { content: ""; position: absolute; left: 34px; top: 26px; width: 16px; height: 16px;
         background: #f0483e; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
         box-shadow: 0 0 0 3px #fff; }
  .lines { font-size: 13px; line-height: 1.45; min-width: 0; }
  .lines .title { font-size: 16px; font-weight: 800; margin-bottom: 2px; }
  .lines .muted { color: #c9d1dc; }
  .badge { position: absolute; right: 12px; top: 12px; font-size: 12px; font-weight: 800; color: #5ff0d8;
           background: rgba(8,10,14,0.75); padding: 5px 10px; border-radius: 999px;
           border: 1px solid #00c2a8; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <img src="icon-512.png" alt="">
      <h1>GPS Camera</h1>
    </div>
    <p class="tagline">Stamp every photo with<br><span>location, date &amp; time</span></p>
    <div class="chips">
      <div class="chip">Address</div>
      <div class="chip">Coordinates</div>
      <div class="chip">Compass</div>
      <div class="chip">Map</div>
    </div>
  </div>

  <div class="photo">
    <div class="sun"></div>
    <div class="hill1"></div>
    <div class="hill2"></div>
    <div class="building"></div>
    <div class="badge">✓ GPS VERIFIED</div>
    <div class="stamp">
      <div class="map"></div>
      <div class="lines">
        <div class="title">Connaught Place, New Delhi</div>
        <div>28.631500° N &nbsp; 77.216700° E</div>
        <div class="muted">16 Nov 2026 · 10:42 AM GMT+05:30</div>
        <div class="muted">Alt 216 m · ±4.2 m · NE 42°</div>
      </div>
    </div>
  </div>
</body>
</html>
